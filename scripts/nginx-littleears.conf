# LittleEars nginx 反向代理配置（可选）
#
# 用途：如果你希望用已有的 nginx 统一管理（比如走 80 端口或绑域名），
#       而不是直接访问 :3000 端口。
#
# 安装（在树莓派上）：
#   sudo cp scripts/nginx-littleears.conf /etc/nginx/sites-available/littleears
#   sudo ln -s /etc/nginx/sites-available/littleears /etc/nginx/sites-enabled/
#   sudo nginx -t          # 测试配置
#   sudo systemctl reload nginx
#
# 访问：http://树莓派IP:8081   （本配置监听 8081，可按需改）
#
# ⚠️ 关键：proxy_set_header X-Forwarded-For 必须保留！
#    LittleEars 靠它获取真实客户端 IP 来判断局域网/公网：
#    - 缺了这行 → 所有请求都显示为 127.0.0.1 → 公网也被当成局域网免密 → 认证失效
#

server {
    listen 8081;              # 改成你想要的端口（避开已用的 80/8080）
    server_name _;

    # 反向代理到 LittleEars（监听 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # —— 关键：传递真实客户端 IP ——
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流媒体支持（<audio> 拖动进度条需要）
        proxy_buffering off;
    }
}
